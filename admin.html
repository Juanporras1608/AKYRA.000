<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Catálogo AKYRA</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #fff; }
    main { width: min(92vw, 620px); padding: 32px; border: 1px solid #333; border-radius: 12px; background: #171717; }
    h1 { margin-top: 0; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; color: #bdbdbd; font: 14px Arial, sans-serif; }
    input, select, textarea { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #444; border-radius: 4px; background: #0d0d0d; color: #fff; font: 15px Arial, sans-serif; }
    textarea { min-height: 110px; resize: vertical; }
    button { padding: 13px 18px; border: 0; border-radius: 4px; background: #fff; color: #000; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    #mensaje { min-height: 24px; color: #bdbdbd; font: 14px Arial, sans-serif; }
    #preview img { width: 120px; height: 120px; object-fit: cover; margin-top: 8px; border-radius: 4px; }
    a { color: #fff; font: 14px Arial, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Nuevo producto</h1>
    <form id="productoForm">
      <label>Nombre del producto <input id="nombre" required></label>
      <label>Categoría
        <select id="categoria" required>
          <option value="Busos">Busos</option>
          <option value="Pantalones">Pantalones</option>
          <option value="Camisetas">Camisetas</option>
        </select>
      </label>
      <label>Precio actual (COP) <input id="precio" type="number" min="1" required></label>
      <label>Precio anterior / descuento (COP) <input id="precio_anterior" type="number" min="0"></label>
      <label>Costo de envío (COP) <input id="costo_envio" type="number" min="0" value="0" required></label>
      <label>Descripción <textarea id="descripcion" required></textarea></label>
      <label>URLs de las fotos (una por línea) <textarea id="imagenes" placeholder="https://...\nhttps://..."></textarea></label>
      <div id="preview"></div>
      <button type="submit" id="guardarBtn">GUARDAR PRODUCTO</button>
      <p id="mensaje" role="status"></p>
    </form>
    <a href="index.html#catalogo">Volver al catálogo</a>
  </main>
  <script>
    const form = document.getElementById('productoForm');
    const imageInput = document.getElementById('imagenes');
    const preview = document.getElementById('preview');
    const button = document.getElementById('guardarBtn');
    const message = document.getElementById('mensaje');

    imageInput.addEventListener('input', () => {
      preview.replaceChildren();
      const urls = imageInput.value.split(/\r?\n/).map(url => url.trim()).filter(Boolean);
      urls.forEach(url => {
        const image = document.createElement('img');
        image.src = url;
        image.alt = 'Vista previa de producto';
        preview.appendChild(image);
      });
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const imageUrls = imageInput.value.split(/\r?\n/).map(url => url.trim()).filter(Boolean);
      if (!imageUrls.length) return;
      button.disabled = true;
      message.textContent = 'Guardando producto...';
      try {
        const price = Number(document.getElementById('precio').value);
        const oldPriceValue = document.getElementById('precio_anterior').value;
        const oldPrice = oldPriceValue === '' ? null : Number(oldPriceValue);
        if (oldPrice !== null && oldPrice <= price) throw new Error('El precio anterior debe ser mayor que el precio actual.');
        const products = JSON.parse(localStorage.getItem('AKYRA_PRODUCTS_V1') || '[]');
        products.push({
          id: `admin-${Date.now()}`,
          name: document.getElementById('nombre').value.trim(),
          category: document.getElementById('categoria').value,
          price,
          oldPrice,
          badge: oldPrice ? 'Oferta' : 'Nuevo',
          inStock: true,
          images: imageUrls,
          material: 'Material del catálogo',
          sizes: ['S', 'M', 'L', 'XL'],
          description: document.getElementById('descripcion').value.trim(),
          shippingFee: Number(document.getElementById('costo_envio').value)
        });
        localStorage.setItem('AKYRA_PRODUCTS_V1', JSON.stringify(products));
        form.reset();
        preview.replaceChildren();
        message.textContent = 'Producto guardado con éxito';
      } catch (error) {
        console.error('Error detallado:', error);
        message.textContent = error.message || 'No se pudo guardar el producto.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
